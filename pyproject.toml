[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "galaxy-unz"
version = "0.1.0"
description = "Far-infrared fine-structure line fitting for gas-phase metallicity without extinction"
readme = "README.md"
authors = [
    { name = "Skarleth Motiño Flores" }
]
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
    "matplotlib>=3.7",
    "tqdm>=4.67",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["galaxy_unz*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
